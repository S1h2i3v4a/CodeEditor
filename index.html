<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeEditor Pro - Modern Web Playground</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=2.1.0" />
</head>
<body class="layout-side">
  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Code<span class="gradient-text">Editor</span></span>
        <span class="brand-badge">PRO</span>
      </div>
    </div>

    <!-- Template Selector -->
    <div class="header-center">
      <div class="template-selector-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <select id="templateSelect" title="Select a starter template">
          <option value="" disabled selected>⚡ Select Starter Template...</option>
          <option value="counter">🚀 Starter: Counter App</option>
          <option value="card">✨ 3D Hover Card</option>
          <option value="particles">🌌 Canvas Particles</option>
          <option value="clock">⏱️ Cyberpunk Clock</option>
          <option value="blank">📄 Clean Blank Canvas</option>
        </select>
      </div>
    </div>

    <!-- Actions / Controls -->
    <div class="actions">
      <!-- Auto Run Toggle -->
      <label class="toggle-switch" title="Auto-run code as you type">
        <input type="checkbox" id="autoRunToggle" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-label">Auto Run</span>
      </label>

      <!-- Run Button -->
      <button id="runBtn" class="btn btn-primary" title="Execute Code (Ctrl + Enter)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Run</span>
      </button>

      <!-- Format Code -->
      <button id="formatBtn" class="btn btn-secondary" title="Auto-indent & Beautify Code">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="21" y1="10" x2="7" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="21" y1="18" x2="7" y2="18"></line>
        </svg>
        <span>Format</span>
      </button>

      <!-- View Switcher -->
      <div class="view-toggles" title="Toggle Layout Mode">
        <button id="layoutSideBtn" class="icon-btn active" title="Side-by-Side (Desktop)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
        </button>
        <button id="layoutStackBtn" class="icon-btn" title="Top-Bottom Stack">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="12" x2="21" y2="12"></line></svg>
        </button>
        <button id="layoutTabsBtn" class="icon-btn" title="Tabbed Single Pane (Focused)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><line x1="2" y1="9" x2="22" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        </button>
      </div>

      <!-- Export / Download -->
      <button id="downloadBtn" class="btn btn-secondary" title="Export as standalone HTML file">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Export</span>
      </button>

      <!-- Clear / Reset -->
      <button id="clearBtn" class="icon-btn danger" title="Clear Code (Reset)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </div>
  </header>

  <!-- Mobile / Tab Navigation (visible in Tabbed mode or small screens) -->
  <nav class="editor-tabs-bar" id="editorTabsBar" style="display: none;">
    <button class="editor-tab active" data-target="html">
      <span class="tab-indicator html-ind"></span> HTML
    </button>
    <button class="editor-tab" data-target="css">
      <span class="tab-indicator css-ind"></span> CSS
    </button>
    <button class="editor-tab" data-target="js">
      <span class="tab-indicator js-ind"></span> JavaScript
    </button>
  </nav>

  <!-- Main Workspace -->
  <main class="workspace" id="workspace">
    <!-- Code Editors Container -->
    <div class="editors-container" id="editorsContainer">
      <!-- HTML Pane -->
      <section class="pane html-pane" data-pane="html">
        <div class="pane-header">
          <div class="pane-title">
            <span class="lang-icon html-tag">&lt;/&gt;</span>
            <span class="lang-name">HTML</span>
          </div>
          <div class="pane-tools">
            <button class="mini-btn copy-btn" data-editor="html" title="Copy HTML">Copy</button>
          </div>
        </div>
        <div class="editor-wrapper">
          <div class="line-numbers" id="htmlLines">1</div>
          <textarea id="html" class="code-input" spellcheck="false" placeholder="<!-- Write your HTML structure here -->"></textarea>
        </div>
      </section>

      <!-- CSS Pane -->
      <section class="pane css-pane" data-pane="css">
        <div class="pane-header">
          <div class="pane-title">
            <span class="lang-icon css-tag">#</span>
            <span class="lang-name">CSS</span>
          </div>
          <div class="pane-tools">
            <button class="mini-btn copy-btn" data-editor="css" title="Copy CSS">Copy</button>
          </div>
        </div>
        <div class="editor-wrapper">
          <div class="line-numbers" id="cssLines">1</div>
          <textarea id="css" class="code-input" spellcheck="false" placeholder="/* Write your styles here */"></textarea>
        </div>
      </section>

      <!-- JavaScript Pane -->
      <section class="pane js-pane" data-pane="js">
        <div class="pane-header">
          <div class="pane-title">
            <span class="lang-icon js-tag">JS</span>
            <span class="lang-name">JavaScript</span>
          </div>
          <div class="pane-tools">
            <button class="mini-btn copy-btn" data-editor="js" title="Copy JS">Copy</button>
          </div>
        </div>
        <div class="editor-wrapper">
          <div class="line-numbers" id="jsLines">1</div>
          <textarea id="js" class="code-input" spellcheck="false" placeholder="// Write your logic and scripts here"></textarea>
        </div>
      </section>
    </div>

    <!-- Output & Preview Section -->
    <div class="output-container" id="outputContainer">
      <div class="output-header">
        <div class="output-title">
          <span class="live-pulse"></span>
          <span>Live Preview</span>
          <span id="errorIndicator" class="error-pill" style="display: none;" title="Click to inspect errors in Console">
            ⚠️ <span id="errorCountText">0 Errors</span>
          </span>
        </div>
        <div class="output-tools">
          <button id="toggleConsoleBtn" class="mini-btn" title="Toggle Developer Console">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
            <span>Console</span>
            <span class="badge" id="consoleBadge" style="display: none;">0</span>
          </button>
          <button id="refreshPreviewBtn" class="mini-btn" title="Reload Frame">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          </button>
          <button id="fullscreenPreviewBtn" class="mini-btn" title="Expand Fullscreen">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
          </button>
        </div>
      </div>

      <!-- Live Preview IFrame -->
      <div class="preview-stage">
        <iframe id="previewFrame" class="preview" sandbox="allow-scripts allow-modals allow-same-origin" title="Preview Frame"></iframe>
      </div>

      <!-- Integrated Virtual Console -->
      <div class="console-drawer" id="consoleDrawer">
        <div class="console-header">
          <div class="console-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
            <span>Interactive Terminal & Console</span>
          </div>
          <div class="console-tools">
            <button id="clearConsoleBtn" class="mini-btn" title="Clear Console Log">Clear</button>
            <button id="closeConsoleBtn" class="mini-btn" title="Close Drawer">&times;</button>
          </div>
        </div>
        <div class="console-body" id="consoleBody">
          <div class="console-log-msg console-system">⚡ Console ready for logs and errors...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Exit Fullscreen Floating Button -->
  <button id="exitFullscreenBtn" class="exit-fullscreen-btn" title="Exit Fullscreen (Esc)">
    ✕ Exit Fullscreen
  </button>

  <!-- Status Bar Footer -->
  <footer class="statusbar">
    <div class="status-left">
      <span class="status-pill status-ready" id="statusState">
        <span class="dot"></span> Ready
      </span>
      <span class="status-item" id="cursorPosition">Ln 1, Col 1</span>
      <span class="status-item" id="statsCount">0 lines</span>
    </div>
    <div class="status-right">
      <span class="status-item" id="saveIndicator">Saved locally</span>
      <span class="status-item shortcut-hint">⌨️ Ctrl + Enter to Run | Ctrl + S to Save</span>
    </div>
  </footer>

  <script src="index.js?v=2.1.0"></script>
</body>
</html>
